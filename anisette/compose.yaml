# Anisette v3 server - Apple-ID provisioning backend for the iPad signing toolchain.
# Consumers: SideStore on the iPad (Settings -> "Anisette URL") and plumesign (--apple-id).
# Deploy: cd $HOME/Server/stacks/anisette && docker compose up -d

services:
  anisette:
    container_name: anisette
    image: dadoum/anisette-v3-server
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
    ports:
      - 6969:6969
    volumes:
      - ./data:/home/Alcoholic/.config/anisette-v3/lib